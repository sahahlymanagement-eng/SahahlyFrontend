<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Home is the marketing landing page (public/marketing/index.html). -->
    <script>
      (function () {
        var p = location.pathname;
        if (p === "/" || p === "") {
          location.replace("/marketing/index.html" + location.search + location.hash);
        }
      })();
    </script>

    <!-- Apply the saved/OS theme before first paint (no flash of wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Fonts (loaded once here instead of @import in every stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Title -->
    <title>Sahahly — Academic Workflow & Quality Management System</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Sahahly is a powerful academic workflow platform for assignment delegation, quality control, analytics, penalties tracking, and team productivity management."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="education system, assignment management, academic workflow, teacher system, quality control, classroom analytics"
    />

    <!-- Author -->
    <meta name="author" content="Sahahly Team" />

    <!-- Open Graph (WhatsApp / Facebook Preview) -->
    <meta property="og:title" content="Sahahly Academic Workflow System" />
    <meta
      property="og:description"
      content="Smart platform to manage assistants, assignments, quality review, analytics and academic operations."
    />
    <meta property="og:image" content="https://sahahly.com/preview.png" />
    <meta property="og:url" content="https://sahahly.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sa7a7ly Academic Workflow System" />
    <meta
      name="twitter:description"
      content="Advanced academic management platform for schools and teaching teams."
    />
    <meta name="twitter:image" content="https://sahahly.com/preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
